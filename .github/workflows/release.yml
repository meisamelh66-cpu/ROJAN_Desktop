name: Release

# Packaging/release pipeline. Triggers only on a vMAJOR.MINOR.PATCH[-PRE]
# tag pushed to main, per docs/standards/versioning.md §6 ("tag creation
# triggers the packaging/release pipeline"). Never runs on ordinary
# commits - a tag is a deliberate, reviewed act (version-bump PR merged,
# then tag created manually), not something CI decides on its own.
on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RojanDesktop.sln

      # A tag build is independently re-verified here, never assumed green
      # because some earlier PR's CI passed - tags can be pushed from any
      # state of main.
      - name: Build (Release)
        run: dotnet build RojanDesktop.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test RojanDesktop.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Resolve version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $version = & ./build/get-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      # Directory.Build.props is the single source of truth
      # (versioning.md §2) - a tag that doesn't match it must never
      # produce a release, since that would mean the tag was cut against
      # the wrong commit or the version bump PR was skipped.
      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v${{ steps.version.outputs.version }}"
          if ($tag -ne $expected) {
            Write-Error "Tag '$tag' does not match Directory.Build.props version '$expected'."
            exit 1
          }

      - name: Publish and package (ZIP)
        shell: pwsh
        run: ./build/publish.ps1 -Version "${{ steps.version.outputs.version }}"

      # Desktop Productionization Sprint 2 (Release Pipeline): Inno Setup
      # isn't preinstalled on windows-latest - Chocolatey is (same
      # "preinstalled on GitHub-hosted runners" reasoning this workflow
      # already relies on for gh below).
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Desktop Productionization Sprint 2 (Code Signing Preparation):
      # signs only if both secrets are configured - see
      # docs/standards/code-signing.md for exactly what they contain and
      # how to obtain a certificate. Absent secrets = unsigned build,
      # identical to every release before a certificate exists, same
      # "no separate flag to toggle" behavior publish-installer.ps1
      # itself already implements.
      - name: Publish and package (installer)
        shell: pwsh
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $signingArgs = @{}
          if ($env:CODE_SIGNING_CERT_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP 'rojan-reception-signing.pfx'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64))
            $signingArgs = @{
              CertificatePath     = $certPath
              CertificatePassword = $env:CODE_SIGNING_CERT_PASSWORD
            }
          }

          ./build/publish-installer.ps1 -Version "${{ steps.version.outputs.version }}" @signingArgs

          if ($signingArgs.ContainsKey('CertificatePath')) {
            Remove-Item $signingArgs.CertificatePath -Force
          }

      # Desktop Productionization Sprint 2 (Release Pipeline): the
      # checksum ROJAN_Web's release-registry.ts records (see
      # docs/standards/release-process.md §4) - generated here, once,
      # against the exact artifact this workflow is about to publish,
      # rather than recomputed by hand later against a possibly-different
      # download.
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-Item "artifacts/ROJAN Reception Setup.exe"
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content "artifacts/ROJAN Reception Setup.exe.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RojanDesktop-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.sha256

      # gh is preinstalled on GitHub-hosted runners - no third-party
      # marketplace action needed to publish the release.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem artifacts/*.zip, "artifacts/*.exe", artifacts/*.sha256
          gh release create "${{ github.ref_name }}" $assets.FullName --title "${{ github.ref_name }}" --generate-notes

      # Desktop Productionization Sprint 2 (Release Pipeline): updating
      # ROJAN_Web's release registry is a deliberate manual, cross-repo
      # step - see docs/standards/release-process.md §3-4 for why this
      # workflow doesn't attempt it automatically (this session has no
      # way to test a cross-repo trigger end-to-end, and a fabricated one
      # would be worse than an honest manual runbook).
      - name: Next step reminder
        shell: pwsh
        run: |
          Write-Output "Release ${{ github.ref_name }} published. Next: update ROJAN_Web's release registry - see docs/standards/release-process.md §4."
